<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>iPhone safe-area regression fixture</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module">
      // Browser QA supplies the device inset; production CSS owns all spacing.
      const params = new URLSearchParams(location.search);
      const inset = params.get('inset');
      if (inset === '59' || inset === '20' || inset === '0') {
        document.documentElement.style.setProperty('--app-safe-top', `${inset}px`);
      }
      if (params.has('suite')) {
        const results = document.createElement('pre');
        results.id = 'results';
        document.body.replaceChildren(results);
        const cases = [
          { name: 'Dynamic Island', width: 390, inset: 59, top: 75 },
          { name: 'Older status bar', width: 390, inset: 20, top: 36 },
          { name: 'Phone browser', width: 390, inset: 0, top: 16 },
          { name: 'Desktop unchanged', width: 1280, inset: 0, top: 0 },
        ];
        const outcomes = [];
        for (const test of cases) {
          const frame = document.createElement('iframe');
          frame.style.cssText = `width:${test.width}px;height:844px;border:0;display:block`;
          frame.src = `?inset=${test.inset}`;
          const loaded = new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
          document.body.append(frame);
          await loaded;
          const doc = frame.contentDocument;
          const headerTop = doc.querySelector('.console-header').getBoundingClientRect().top;
          const bar = frame.contentWindow.getComputedStyle(doc.body, '::after');
          const blackSpace = parseFloat(bar.height) === test.top && (test.top === 0 || bar.backgroundColor === 'rgb(0, 0, 0)');
          outcomes.push({ name: test.name, headerTop, expectedTop: test.top, blackSpace, pass: headerTop === test.top && blackSpace });
        }
        results.textContent = JSON.stringify(outcomes, null, 2);
        results.dataset.status = outcomes.every(result => result.pass) ? 'pass' : 'fail';
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div class="app-shell">
        <header class="console-header"><div class="console-logo console-wordmark"><img src="/wordmark.svg" alt="After the Buzzer" /></div><h1>Nightly Recap</h1></header>
        <nav class="game-tabs"><button>Recap</button><button>Games</button><button>Watchlist</button><button>Archive</button><button>Settings</button></nav>
        <section class="panel"><div class="panel-title"><h2>Player Roster</h2></div><p>Safe-area layout fixture</p></section>
      </div>
    </div>
  </body>
</html>
